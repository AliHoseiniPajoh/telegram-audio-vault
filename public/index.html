<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>صندوقچه صوتی شخصی</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Modular CSS Sheets -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/player.css" />
  <link rel="stylesheet" href="css/library.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-badge">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <span class="brand-title">صندوقچه صوتی</span>
      </div>
      <div class="vault-badge" id="user-badge">
        <span>شخصی</span>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-container" id="search-container">
      <div class="search-input-wrapper">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" id="search-input" class="search-input" placeholder="جستجو در ترَک‌ها، پادکست‌ها و وویس‌ها..." />
        <button id="search-clear" class="search-clear-btn" aria-label="پاک کردن">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-tab active" id="tab-tracks">همه فایل‌ها</button>
      <button class="nav-tab" id="tab-playlists">پلی‌لیست‌ها</button>
    </nav>

    <!-- Scrollable Main View -->
    <main class="content-view" id="content-view">
      <!-- Dynamically filled by UI.js -->
    </main>

    <!-- Floating Mini Player (Bottom Bar) -->
    <div class="mini-player hidden" id="mini-player">
      <div class="mini-player-progress" id="mini-progress"></div>
      <div class="mini-artwork" id="mini-artwork"></div>
      <div class="mini-info">
        <div class="mini-title" id="mini-title">عنوان ترَک</div>
        <div class="mini-artist" id="mini-artist">نام هنرمند</div>
      </div>
      <div class="mini-controls">
        <button class="mini-play-btn" id="mini-play-btn" aria-label="پخش/توقف"></button>
        <button class="icon-btn" id="mini-next-btn" aria-label="ترک بعدی">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Expandable Full-Screen Sheet Player -->
    <div class="expanded-player" id="expanded-player">
      <!-- Dynamic Ambient Glow Backdrop -->
      <div class="ambient-glow" id="ambient-glow"></div>

      <div class="sheet-header">
        <div class="drag-pill"></div>
        <div class="sheet-nav">
          <button class="icon-btn" id="expanded-close-btn" aria-label="بستن پلیر">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <span class="sheet-nav-title">در حال پخش</span>
          <div style="width: 40px;"></div> <!-- Spacer for symmetry -->
        </div>
      </div>

      <!-- Artwork & Visualizer -->
      <div class="artwork-wrapper" id="artwork-wrapper">
        <div class="artwork-card" id="artwork-card">
          <div class="soundwave">
            <div class="soundwave-bar"></div>
            <div class="soundwave-bar"></div>
            <div class="soundwave-bar"></div>
            <div class="soundwave-bar"></div>
            <div class="soundwave-bar"></div>
          </div>
        </div>
      </div>

      <!-- Synced Lyrics View (Apple Music Style) -->
      <div class="lyrics-wrapper hidden" id="lyrics-wrapper">
        <div class="lyrics-topbar">
          <span class="lyrics-badge">متن هماهنگ ترانه</span>
          <button class="lyrics-close-btn" id="btn-close-lyrics" aria-label="بستن متن">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="lyrics-scroller" id="lyrics-scroller">
          <div class="lyrics-list" id="lyrics-list">
            <!-- Populated dynamically by UI.js -->
          </div>
        </div>
      </div>

      <!-- Metadata -->
      <div class="track-meta">
        <div class="track-meta-row">
          <div class="track-meta-text">
            <h2 class="track-meta-title" id="expanded-title">عنوان فایل</h2>
            <div class="track-meta-artist" id="expanded-artist">هنرمند</div>
          </div>
          <button class="icon-btn btn-like" id="btn-like" aria-label="علاقه‌مندی"></button>
        </div>
      </div>

      <!-- Scrubber -->
      <div class="scrubber-container">
        <input type="range" class="seek-slider" id="seek-slider" min="0" max="100" value="0" step="0.1" />
        <div class="time-row">
          <span id="current-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <button class="ctrl-btn" id="btn-shuffle" aria-label="پخش تصادفی">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>

        <button class="ctrl-btn" id="btn-prev" aria-label="ترک قبلی">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <button class="ctrl-btn ctrl-btn-primary" id="btn-play" aria-label="پخش"></button>

        <button class="ctrl-btn" id="btn-next" aria-label="ترک بعدی">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>

        <button class="ctrl-btn" id="btn-repeat" aria-label="حالت تکرار">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>
      </div>

      <!-- Action Strip -->
      <div class="action-strip">
        <button class="chip-btn" id="btn-lyrics" title="متن زنده ترانه">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <line x1="9" y1="9" x2="15" y2="9"></line>
            <line x1="9" y1="13" x2="13" y2="13"></line>
          </svg>
          <span>متن ترانه</span>
        </button>
        <button class="chip-btn" id="btn-sleep" title="تایمر خواب هوشمند">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span id="btn-sleep-text">تایمر خواب</span>
        </button>
        <button class="chip-btn" id="btn-speed">1.0x</button>
        <button class="chip-btn" id="btn-queue">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          <span>صف پخش</span>
        </button>
        <button class="chip-btn" id="btn-add-to-pl">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>پلی‌لیست</span>
        </button>
        <button class="chip-btn" id="btn-download-expanded" title="دانلود و ذخیره دائمی در حافظه گوشی">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span id="btn-download-expanded-text">دانلود آفلاین</span>
        </button>
        <button class="chip-btn" id="btn-play-native" title="پخش در پلیر اصلی تلگرام (بدون ۱ بایت دانلود مجدد)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          <span>پخش در تلگرام</span>
        </button>
      </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box">
        <div class="modal-title" id="modal-title">عنوان مودال</div>
        <div id="modal-body"></div>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-msg" id="toast-msg">پیام سیستم</div>
  </div>

  <!-- Client JavaScript Modules -->
  <script src="js/icons.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/api.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
